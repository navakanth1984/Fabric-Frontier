<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forest Portal Parallax</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h2 class="logo">Forest Portal</h2>
        <nav>
            <a href="#" class="active">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <section class="parallax">
        <img src="assets/portal_bg.png" id="bg">
        <img src="assets/portal_frame.png" id="portal">
        <h2 id="text">Enter the Void</h2>
        <img src="assets/foreground_left.png" id="plant_left">
        <img src="assets/foreground_right.png" id="plant_right">
    </section>

    <section class="sec">
        <h2>The Journey Begins</h2>
        <p>This is where the content goes. Scroll down to see the parallax magic in action.</p>
        <div class="cards">
            <div class="card" style="background-image: url('assets/ui_card_style.png')">
                <h3>UI Element 1</h3>
            </div>
            <div class="card" style="background-image: url('assets/ui_card_style.png')">
                <h3>UI Element 2</h3>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
